<svg width="770" height="250" viewBox="0 0 770 250" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .terminal-bg { fill: #010409; stroke: #30363d; stroke-width: 1.5; }
        .text-primary { fill: #c9d1d9; font-family: 'Courier New', Courier, monospace; font-size: 16px; }
        .accent { fill: #58a6ff; font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; }
        .sys { fill: #3fb950; font-family: 'Courier New', Courier, monospace; font-size: 16px; }
        
        @keyframes typing {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor { animation: blink 1s step-end infinite; }
        
        .line1 { animation: typing 0.1s steps(1) forwards; opacity: 0; animation-delay: 0.5s; }
        .line2 { animation: typing 0.1s steps(1) forwards; opacity: 0; animation-delay: 1.5s; }
        .line3 { animation: typing 0.1s steps(1) forwards; opacity: 0; animation-delay: 2.0s; }
        .line4 { animation: typing 0.1s steps(1) forwards; opacity: 0; animation-delay: 3.0s; }
        .line5 { animation: typing 0.1s steps(1) forwards; opacity: 0; animation-delay: 3.5s; }
        .line6 { animation: typing 0.1s steps(1) forwards; opacity: 0; animation-delay: 4.5s; }
    </style>
    
    <rect x="0.75" y="0.75" width="768.5" height="248.5" rx="10" class="terminal-bg" />
    <path d="M0.75,10 a10,10 0 0 1 10,-10 h748.5 a10,10 0 0 1 10,10 v20 h-768.5 v-20" fill="#21262d"/>
    <circle cx="20" cy="15" r="5" fill="#ff5f56" />
    <circle cx="40" cy="15" r="5" fill="#ffbd2e" />
    <circle cx="60" cy="15" r="5" fill="#27c93f" />
    <text x="385" y="19" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">ai-assistant@krishna ~</text>
    
    <g transform="translate(20, 60)">
        <text class="sys line1" x="0" y="0">$ sys.init()</text>
        <text class="text-primary line2" x="0" y="25">> System initialized. AI Core online.</text>
        
        <text class="accent line3" x="0" y="65">$ get_skills()</text>
        <text class="text-primary line4" x="0" y="90">> [JavaScript, Python, C++, HTML/CSS, Git, GitHub]</text>
        
        <text class="accent line5" x="0" y="130">$ get_databases()</text>
        <text class="text-primary line6" x="0" y="155">> [MongoDB, MySQL, PostgreSQL, Firebase, Supabase]</text>
        
        <text class="accent" x="0" y="195" style="animation: typing 0.1s steps(1) forwards; opacity: 0; animation-delay: 5.5s;">$ ping user <tspan class="text-primary cursor">_</tspan></text>
    </g>
</svg>