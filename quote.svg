<svg width="770" height="120" viewBox="0 0 770 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
        .quote { font: italic 18px 'Georgia', serif; fill: #c9d1d9; }
        .author { font: 400 14px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; fill: #8b949e; }
        .icon { fill: #58a6ff; opacity: 0.3; }
    </style>
    <rect x="0.75" y="0.75" width="768.5" height="118.5" rx="4.25" class="bg" />
    
    <text x="40" y="50" font-size="60" class="icon">"</text>
    <text x="385" y="65" class="quote" text-anchor="middle">Any fool can write code that a computer can understand.</text>
    <text x="385" y="90" class="quote" text-anchor="middle">Good programmers write code that humans can understand.</text>
    <text x="680" y="100" class="author" text-anchor="end">- Martin Fowler</text>
</svg>